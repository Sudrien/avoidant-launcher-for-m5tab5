# SPDX-License-Identifier: MIT
name: Publish the flasher

# Publishes the site to GitHub Pages: the committed files in web/, with the commit it was built from written into
# index.html's footer, and each Tab5 project's newest release's
# _standalone.bin in firmware/, listed in firmware/index.json -- and,
# 0029, its .elf where it has one: an app Duplicitous runs, sent to the
# card from step 3, with the feckless ABI version it was built for. The page
# cannot fetch release downloads from github.com itself (no CORS), which
# is why this deploys from an action rather than from the branch.
#
# The projects release on their own schedule, so this also runs daily
# to pick up new releases; by hand works too.
#
# Pages must be set to deploy from GitHub Actions (Settings -> Pages ->
# Build and deployment -> Source: GitHub Actions), not from the branch.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * *'

permissions:
  contents: read  # also enough to read the projects' public releases
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a
# deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          # exactly the committed files, not anything a step left behind
          mkdir _site
          git archive HEAD:web | tar -x -C _site
          # the commit, into the footer, so the page says which build it is
          sed -i "s/data-build=\"__BUILD_SHA__\"/data-build=\"${GITHUB_SHA}\"/" _site/index.html
          # refuse to publish an unstamped page
          grep -q "data-build=\"${GITHUB_SHA}\"" _site/index.html
          # refuse to publish without the page
          test -f _site/index.html

      # A project with no release, or one whose release has no
      # _standalone.bin, is left out with a warning; the page lists what
      # is there. A project that fails to download is the same, rather
      # than one project keeping the page from publishing.
      - name: Fetch the projects' firmware
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECTS: >-
            duplicitous-for-m5tab5
            defeatist-music-player-for-m5tab5
            unprofitable-mahjong
            aimless-moving-map-for-m5tab5
            lothesome-audio-analyzer-for-m5tab5
        run: |
          mkdir -p _site/firmware
          : > _site/firmware/list.tsv
          for repo in $PROJECTS; do
            tag=$(gh release view -R "Sudrien/$repo" --json tagName -q .tagName 2>/dev/null) \
              || { echo "::warning::$repo has no release"; continue; }
            d="_site/firmware/$repo"
            mkdir -p "$d"
            gh release download "$tag" -R "Sudrien/$repo" -p '*_standalone.bin' -D "$d" \
              || echo "::warning::$repo $tag: no _standalone.bin downloaded"
            # 0029: an .elf app for Duplicitous, where the release has one.
            # Most do not; that is not a warning.
            gh release download "$tag" -R "Sudrien/$repo" -p '*.elf' -D "$d" 2>/dev/null || true
            for f in "$d"/*_standalone.bin; do
              if [ -e "$f" ]; then
                printf '%s\t%s\t%s\t%s\tbin\n' "$repo" "$tag" "${f#_site/firmware/}" "Sudrien/$repo" >> _site/firmware/list.tsv
              fi
            done
            for f in "$d"/*.elf; do
              if [ -e "$f" ]; then
                printf '%s\t%s\t%s\t%s\telf\n' "$repo" "$tag" "${f#_site/firmware/}" "Sudrien/$repo" >> _site/firmware/list.tsv
              fi
            done
            rmdir "$d" 2>/dev/null || true     # nothing downloaded
          done
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.parse
          out = []
          for line in open('_site/firmware/list.tsv'):
              repo, tag, path, full, kind = line.rstrip('\n').split('\t')
              data = open('_site/firmware/' + path, 'rb').read()
              entry = {'project': repo, 'tag': tag, 'path': path, 'kind': kind,
                       'file': os.path.basename(path), 'size': len(data),
                       'sha256': hashlib.sha256(data).hexdigest(),
                       # the release page, for downloading by hand
                       'release': 'https://github.com/%s/releases/tag/%s'
                                  % (full, urllib.parse.quote(tag, safe=''))}
              if kind == 'elf':
                  # An app for Duplicitous: a 32-bit RISC-V shared object, as
                  # feckless_abi_elf() makes (Duplicitous's elfrun.c asks the
                  # same) -- not an IDF build's debug ELF, which is an
                  # executable and may name the symbol too -- and the ABI it
                  # was built for, the feckless_abi_vN it refers to.
                  m = re.search(rb'feckless_abi_v(\d+)\x00', data)
                  app = (data[:4] == b'\x7fELF' and data[4] == 1 and data[5] == 1
                         and int.from_bytes(data[16:18], 'little') == 3
                         and int.from_bytes(data[18:20], 'little') == 243)
                  if not (app and m):
                      print('::warning::%s %s: %s is not a feckless ABI app, left out' % (repo, tag, path))
                      os.remove('_site/firmware/' + path)
                      continue
                  entry['abi'] = int(m.group(1))
              out.append(entry)
          json.dump(out, open('_site/firmware/index.json', 'w'), indent=1)
          print(json.dumps(out, indent=1))
          PY
          rm _site/firmware/list.tsv

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
