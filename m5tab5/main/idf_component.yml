dependencies:
  idf:
    version: ">=6.1"

  # 0030: the feckless libraries, from feckless-libs-for-m5tab5, every
  # one at the same tag -- feckless_abi fails the build otherwise. The
  # ABI the .elf apps are run on (0023), the panel, backlight and gfx
  # text, the I2C bus, IO expanders, touch and USB host, and the card and
  # the drive. 0031: v0.3.0, which adds the rest of what was here --
  # fatfs with exFAT (cmake/exfat.cmake's job), usb_host_msc with the
  # Tab5's fixes (components/usb_host_msc's), usb_host_uac (the drivers'
  # pin until v0.2.0) -- and the ABI's storage section, so .elf apps get
  # the card and the drive. 0035: v0.4.1, and the ABI's nvs section with
  # feckless_nvs_handler, which brings NVS up for this firmware and the
  # apps it runs, so an .elf app keeps its settings and saves (Unprofitable
  # Mahjong's 0100).
  # 0039: v0.5.0 -- the storage section's version 2, with FatFs's fast
  # seek (feckless-libs' 5003), which Errant's and Spurious's readers
  # need; and the core list's additions for them (5002). 0041: v0.6.0,
  # and the ABI's network section with feckless_network_handler behind
  # it (6004), so an .elf app gets Wi-Fi, USB Ethernet, sockets and HTTP
  # -- Errant Moving Map's. And the drivers in the core list (6002).
  # 0046: v0.8.0, one tag for all as before (feckless_abi fails the build
  # otherwise). From v0.7: esp_ota_set_boot_partition and four more names
  # in the core list (7002), which Defeatist's ELF needs to leave to the
  # launcher; the image section (7010) and feckless_image_handler's
  # decoders for apps. From v0.8: the network section's feckless_https_*
  # (8004) -- the device's HTTPS certificate is this firmware's, so an
  # app's remote has one fingerprint to accept and never holds the key --
  # and the mDNS responder for the name its redirect sends a browser to
  # (8005), which adds espressif/mdns to feckless_network_handler's
  # manifest. v0.8.0 is the tag the 8000 series leads to.
  feckless_abi:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi
    version: "v0.10.2"
  feckless_abi_storage:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_storage
    version: "v0.10.2"
  feckless_abi_network:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_network
    version: "v0.10.2"
  feckless_network_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_network_handler
    version: "v0.10.2"
  feckless_abi_nvs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_nvs
    version: "v0.10.2"
  # 0036: the ABI's camera section, and feckless_camera behind it, so an
  # .elf app can read the camera -- Unprofitable Mahjong's Scan a code.
  # feckless_camera's manifest pins esp_video; components/esp_ipa stands
  # in for the esp_ipa that brings (its VENDORED.md says why).
  feckless_abi_camera:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_camera
    version: "v0.10.2"
  feckless_camera:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_camera
    version: "v0.10.2"
  # 0048: the ABI's image and crypto sections, so Defeatist Music Player's
  # .elf runs here: its pictures use the P4's JPEG engine (the image
  # section) and approve.c a SHA-256 (the crypto section, shrunk to
  # hashing in feckless-libs' 8007, which is why this is v0.8.2).
  feckless_abi_image:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_image
    version: "v0.10.2"
  feckless_abi_crypto:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_crypto
    version: "v0.10.2"
  # 0049: the ABI's audio section (feckless-libs' 8008, in v0.8.3, which
  # moves every pin here): esp_audio_codec's decoders for Defeatist Music
  # Player's .elf, which cannot link them itself -- the codec's archives
  # are not position-independent. feckless_abi_audio's own manifest pins
  # espressif/esp_audio_codec at exactly 2.5.0 (2.6 needs P4 silicon
  # revision 3.0; the Tab5s are v1.3), so this launcher and the app agree
  # on the structures the app hands the codec.
  feckless_abi_audio:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi_audio
    version: "v0.10.2"
  # 0051: feckless_keyboard (feckless-libs' 8010, 8011, from v0.8.5) for
  # the Wi-Fi page's typing, and every pin moved to v0.8.7 with it.
  feckless_keyboard:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_keyboard
    version: "v0.10.2"
  feckless_nvs_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_nvs_handler
    version: "v0.10.2"
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_drivers
    version: "v0.10.2"
  feckless_graphics_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_graphics_handler
    version: "v0.10.2"
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_storage_handler
    version: "v0.10.2"
  fatfs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/fatfs
    version: "v0.10.2"
  usb_host_msc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_msc
    version: "v0.10.2"
  usb_host_uac:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_uac
    version: "v0.10.2"

  # 0054: every pin above, v0.8.7 -> v0.9.4: feckless_fetch (9003, 9004)
  # in the network handler, and nvsh_list/nvsh_stats/nvsh_log (9005) in
  # feckless_nvs_handler and the ABI's nvs section, which 0055 calls.
  # esp_hosted held below 3.1.0, on top of feckless_network_handler's
  # ">=3.0.2", as Defeatist's 8097 does: 3.1.0 (2026-11-05) fixes its SDIO
  # RX staging buffers at 1536 bytes for a co-processor that sends no
  # SDIO_MODE TLV -- the Tab5's C6 sends none -- and refuses the C6's
  # batched reads, so every TLS handshake lost its certificate burst
  # ("SDIO RX read (5120 bytes) exceeds staging target") on a Tab5.
  # 3.0.10 worked. This keeps the host side where it was, not an update.
  espressif/esp_hosted: ">=3.0.7,<3.1.0"

  # 0057: every pin above, v0.9.4 -> v0.10.0, and the IDF floor 5.4.2 ->
  # 6.1: v0.10.0 (feckless-libs' 9015) removes ESP-IDF 5.x support, and
  # usb_host_msc and usb_host_uac now say `idf: ">=6.1"`, so the
  # component manager would refuse them on 5.x. Also in the range:
  # feckless_chooser and storage_list.h (9011, 9012), mailsend_with()
  # (9009, 9010), wifi_stop() without a false SDMMC error (9013), the
  # RX8130 alarm and nCHG_QC_EN driven low before CHG_EN (9014), bold and
  # heavy gfx text. The ABI stays feckless_abi_v1; its `_ctype_b` name is
  # `_ctype_` now, the one IDF 6.1's newlib refers to.
