dependencies:
  idf:
    version: ">=5.4.2"

  # 0023: the panel, backlight and gfx text; and the I2C bus, IO
  # expanders and touch -- feckless_graphics_handler and
  # feckless_drivers, and usb_host_uac, which the drivers build -- pinned
  # in feckless-abi-for-m5tab5, the ABI the .elf apps are run on. Its tag
  # is that ABI.
  feckless_abi:
    git: https://github.com/Sudrien/feckless-abi-for-m5tab5.git
    version: "v0.2.4"   # 0024: graphics handler v0.2.9; 0025: the version symbol
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-storage-handler-for-m5tab5.git
    version: "v0.1.0"

  # usb_host_msc is not here: feckless_storage_handler requires it by
  # name, and components/usb_host_msc is the player's patched 1.3.0 (its
  # 5035/6031: transfers cut to what the Tab5's DMA memory can give).
